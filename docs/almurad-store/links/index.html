<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<style>
  :root{
    --bg:#0f1720;
    --card:rgba(255,255,255,.06);
    --border:rgba(255,255,255,.12);
    --text:#f4f7fa;
    --muted:#9fb0c0;
    --accent:#2dd4a7;
  }
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
  body{
    font-family:'Tajawal',-apple-system,"Segoe UI",Tahoma,Arial,sans-serif;
    background:radial-gradient(1000px 600px at 50% -10%,#1c3350 0%,var(--bg) 60%);
    color:var(--text);min-height:100vh;
    display:flex;justify-content:center;
    padding:44px 18px 60px;
  }
  .wrap{width:100%;max-width:440px;text-align:center}

  .logo{
    width:110px;height:110px;margin:0 auto 18px;border-radius:28px;
    background:#fff;
    display:flex;align-items:center;justify-content:center;
    padding:11px;
    box-shadow:0 14px 36px rgba(0,0,0,.42);
    overflow:hidden;
  }
  .logo img{width:100%;height:100%;object-fit:contain;display:block}

  h1{font-size:27px;font-weight:900;letter-spacing:-.3px}
  .tag{color:var(--muted);font-size:15px;font-weight:500;margin-top:8px;line-height:1.75}

  .links{margin-top:32px;display:flex;flex-direction:column;gap:13px}

  a.btn{
    display:flex;align-items:center;gap:14px;
    background:var(--card);border:1px solid var(--border);
    border-radius:16px;padding:15px 18px;
    color:var(--text);text-decoration:none;font-size:16px;font-weight:700;
    transition:transform .15s ease,background .15s ease,border-color .15s ease;
    backdrop-filter:blur(8px);
  }
  a.btn:hover{transform:translateY(-2px);background:rgba(255,255,255,.11);border-color:rgba(255,255,255,.25)}
  a.btn:active{transform:translateY(0)}

  .ico{width:38px;height:38px;border-radius:11px;display:flex;align-items:center;justify-content:center;flex:0 0 38px;overflow:hidden}
  .ico svg{width:21px;height:21px;fill:#fff}
  .ico img{width:100%;height:100%;object-fit:contain;padding:4px;display:block}

  .txt{flex:1;text-align:right;min-width:0}
  .txt small{display:block;color:var(--muted);font-size:12.5px;font-weight:500;margin-top:3px;direction:ltr;text-align:right;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .chev{color:var(--muted);font-size:19px;transform:scaleX(-1)}

  .wa{background:#25D366}
  .fb{background:#1877F2}
  .ig{background:linear-gradient(45deg,#f09433,#dc2743,#bc1888)}
  .web{background:#fff}
  .map{background:#e8543f}
  .tel{background:#229ED9}
  .tik{background:#000}

  .share{
    margin-top:20px;width:100%;
    display:flex;align-items:center;justify-content:center;gap:9px;
    background:transparent;border:1px dashed var(--border);
    border-radius:16px;padding:14px;
    color:var(--muted);font-family:inherit;font-size:15px;font-weight:700;
    cursor:pointer;transition:.15s;
  }
  .share:hover{background:var(--card);color:var(--text);border-style:solid;border-color:var(--accent)}
  .share:active{transform:scale(.98)}
  .share svg{width:19px;height:19px;fill:currentColor}

  .toast{
    position:fixed;bottom:26px;left:50%;
    transform:translateX(-50%) translateY(22px);
    background:#fff;color:#0f1720;padding:12px 24px;border-radius:13px;
    font-size:14px;font-weight:700;opacity:0;pointer-events:none;
    transition:.25s ease;z-index:99;box-shadow:0 10px 30px rgba(0,0,0,.4);
  }
  .toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.sheet{position:fixed;inset:0;z-index:200;display:flex;align-items:flex-end;justify-content:center}
  .sheet[hidden]{display:none}
  .sheet-bg{position:absolute;inset:0;background:rgba(0,0,0,.62);backdrop-filter:blur(4px);animation:fadeIn .2s ease}
  .sheet-box{
    position:relative;width:100%;max-width:440px;
    background:#16222f;border:1px solid var(--border);
    border-radius:22px 22px 0 0;padding:22px 16px 24px;
    animation:riseUp .25s ease;
  }
  @keyframes fadeIn{from{opacity:0}to{opacity:1}}
  @keyframes riseUp{from{transform:translateY(100%)}to{transform:none}}
  .sheet-title{font-size:16px;font-weight:800;margin-bottom:16px;text-align:right;padding-right:6px}
  .sheet-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
  .sopt{
    display:flex;flex-direction:column;align-items:center;gap:8px;
    background:transparent;border:0;cursor:pointer;
    color:var(--muted);font-family:inherit;font-size:12px;font-weight:700;
    padding:8px 2px;border-radius:14px;transition:.15s;
  }
  .sopt:hover{background:var(--card);color:var(--text)}
  .sopt[hidden]{display:none}
  .sopt i{width:46px;height:46px;border-radius:15px;display:flex;align-items:center;justify-content:center}
  .sopt svg{width:23px;height:23px;fill:#fff}
  .s-copy{background:#3c5266}
  .s-more{background:#6b5bb5}
  .sheet-close{
    width:100%;margin-top:18px;padding:13px;
    background:var(--card);border:1px solid var(--border);border-radius:14px;
    color:var(--text);font-family:inherit;font-size:15px;font-weight:700;cursor:pointer;
  }
  .sheet-close:hover{background:rgba(255,255,255,.11)}
  @media(min-width:520px){
    .sheet{align-items:center}
    .sheet-box{border-radius:22px;animation:fadeIn .2s ease}
  }
  footer{margin-top:36px;color:var(--muted);font-size:12.5px;font-weight:500}
</style>

<script>
document.getElementById('y').textContent = new Date().getFullYear();

var SHARE_URL  = window.location.href.split('#')[0].split('?')[0];
var SHARE_TEXT = 'سنتر المراد — أجهزة منزلية وأدوات مطبخ بأفضل الأسعار في العراق';
var SHARE_MSG  = SHARE_TEXT + '\n' + SHARE_URL;

var toastEl = document.getElementById('toast');
function toast(msg){
  toastEl.textContent = msg;
  toastEl.classList.add('show');
  setTimeout(function(){ toastEl.classList.remove('show'); }, 2200);
}

var sheet = document.getElementById('sheet');
function openSheet(){ sheet.hidden = false; document.body.style.overflow = 'hidden'; }
function closeSheet(){ sheet.hidden = true; document.body.style.overflow = ''; }

document.getElementById('shareBtn').addEventListener('click', openSheet);
document.getElementById('sheetBg').addEventListener('click', closeSheet);
document.getElementById('sheetClose').addEventListener('click', closeSheet);
document.addEventListener('keydown', function(e){ if(e.key === 'Escape') closeSheet(); });

if (navigator.share) document.getElementById('nativeOpt').hidden = false;

function go(u){ window.open(u, '_blank', 'noopener'); }

function fallbackCopy(){
  var t = document.createElement('textarea');
  t.value = SHARE_URL;
  t.style.position = 'fixed';
  t.style.opacity = '0';
  document.body.appendChild(t);
  t.select();
  try { document.execCommand('copy'); toast('تم نسخ الرابط ✓'); }
  catch(e){ window.prompt('انسخ الرابط:', SHARE_URL); }
  t.remove();
}

function copyLink(){
  if (navigator.clipboard && window.isSecureContext){
    navigator.clipboard.writeText(SHARE_URL).then(function(){ toast('تم نسخ الرابط ✓'); }, fallbackCopy);
  } else {
    fallbackCopy();
  }
}

var ACTIONS = {
  wa:   function(){ go('https://wa.me/?text=' + encodeURIComponent(SHARE_MSG)); },
  tg:   function(){ go('https://t.me/share/url?url=' + encodeURIComponent(SHARE_URL) + '&text=' + encodeURIComponent(SHARE_TEXT)); },
  fb:   function(){ go('https://www.facebook.com/sharer/sharer.php?u=' + encodeURIComponent(SHARE_URL)); },
  copy: copyLink,
  native: function(){
    navigator.share({ title:'سنتر المراد', text:SHARE_TEXT, url:SHARE_URL }).catch(function(){});
  }
};

document.querySelectorAll('.sopt').forEach(function(btn){
  btn.addEventListener('click', function(){
    var fn = ACTIONS[btn.getAttribute('data-act')];
    closeSheet();
    if (fn) setTimeout(fn, 60);
  });
});
</script>
