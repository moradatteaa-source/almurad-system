<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>إرسال الشحنة</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Tajawal', sans-serif;
      background: #f6f6f6;
      padding-top: 70px;
    }
    .header-fixed {
      position: fixed; top: 0; right: 0; left: 0;
      background: #043B64; color: #fff;
      padding: 14px; text-align: center;
      font-size: 18px; font-weight: 700;
      z-index: 1000; box-shadow: 0 2px 5px rgba(0,0,0,0.2);
    }
    .back-arrow {
      position: absolute; right: 12px; top: 50%;
      transform: translateY(-50%); font-size: 22px; cursor: pointer;
    }
    .container { padding: 16px; max-width: 700px; margin: 0 auto; }
    .card {
      background: #fff; padding: 18px; border-radius: 14px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.08); margin-bottom: 16px;
    }
    .card-title { font-size: 16px; font-weight: 700; color: #043B64; margin-bottom: 12px; }
    label { font-weight: 600; font-size: 14px; display: block; margin-bottom: 6px; }
    select, input {
      width: 100%; padding: 11px 14px; border-radius: 10px;
      border: 1.5px solid #ddd; font-size: 14px; background: #fafbfc;
      outline: none; transition: border-color 0.2s;
    }
    select:focus, input:focus { border-color: #043B64; }
    .stats {
      display: flex; gap: 10px; flex-wrap: wrap; margin-top: 12px;
    }
    .stat-box {
      flex: 1; min-width: 100px; background: #f0f7ff;
      border-radius: 10px; padding: 12px; text-align: center;
      border: 1px solid #d0e8f8;
    }
    .stat-num { font-size: 22px; font-weight: 800; color: #043B64; }
    .stat-label { font-size: 12px; color: #666; margin-top: 2px; }
    .btn {
      width: 100%; padding: 14px; text-align: center;
      border-radius: 12px; border: none; cursor: pointer;
      font-size: 16px; font-weight: 700; margin-top: 10px;
      transition: all 0.2s;
    }
    .btn:active { transform: scale(0.98); }
    .btn-primary { background: #043B64; color: #fff; }
    .btn-primary:hover { background: #085694; }
    .btn-primary:disabled { background: #aaa; cursor: not-allowed; }
    .btn-outline { background: #fff; color: #043B64; border: 2px solid #043B64; }
    .log-box {
      background: #fff; padding: 14px; min-height: 200px;
      border-radius: 12px; box-shadow: 0 1px 4px rgba(0,0,0,0.08);
      overflow-y: auto; max-height: 400px; font-size: 13px;
    }
    .log-item {
      padding: 7px 0; border-bottom: 1px solid #f0f0f0;
      line-height: 1.5;
    }
    .log-item:last-child { border-bottom: none; }
    .ok  { color: #27ae60; font-weight: 700; }
    .err { color: #e74c3c; font-weight: 700; }
    .info { color: #043B64; font-weight: 600; }
    .warn { color: #e67e22; font-weight: 600; }

    /* Progress bar */
    .progress-wrap {
      background: #ecf0f1; border-radius: 10px;
      height: 10px; margin: 10px 0; overflow: hidden; display: none;
    }
    .progress-bar {
      height: 100%; background: linear-gradient(90deg, #043B64, #2980b9);
      transition: width 0.3s; border-radius: 10px;
    }

    /* تحديد الطلبات */
    .select-bar {
      display: flex; justify-content: space-between; align-items: center;
      margin-bottom: 8px; flex-wrap: wrap; gap: 6px;
    }
    #selectedInfo { font-size: 13px; color: #666; font-weight: 600; }
    .select-bar .mini-btn {
      background: none; border: 1.5px solid #043B64; color: #043B64;
      font-weight: 700; font-size: 12px; cursor: pointer;
      padding: 5px 10px; border-radius: 8px;
    }
    .select-bar .mini-btn:active { transform: scale(0.97); }
    .orders-list {
      max-height: 340px; overflow-y: auto;
      display: flex; flex-direction: column; gap: 8px;
    }
    .order-row {
      display: flex; align-items: center; gap: 10px;
      background: #fafbfc; border: 1.5px solid #e3e7ea; border-radius: 10px;
      padding: 10px 12px; font-size: 13px; cursor: pointer;
    }
    .order-row.checked { border-color: #043B64; background: #f0f7ff; }
    .order-row input[type="checkbox"] { width: 18px; height: 18px; flex-shrink: 0; cursor: pointer; }
    .order-row .row-id { font-weight: 800; color: #043B64; white-space: nowrap; }
    .order-row .row-info {
      flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis;
      white-space: nowrap; color: #555;
    }
    .order-row .row-price { font-weight: 700; color: #333; white-space: nowrap; font-size: 12px; }
    .empty-msg { text-align: center; color: #999; font-size: 13px; padding: 14px 0; }
  </style>
</head>

<body>

<!-- HEADER -->
<header class="header-fixed">
  <span id="backArrow" class="back-arrow">❮</span>
  <span>إرسال الشحنة</span>
</header>

<div class="container">

  <!-- إعدادات الرفع -->
  <div class="card">
    <div class="card-title">⚙️ إعدادات الشحن</div>
    <label>شركة الشحن:</label>
    <select id="shippingCompany">
    <option value="waseet" selected>🚚 الوسيط</option>
<option value="prime">🚀 برايم</option>
<option value="jenni">📦 Jenni</option>
    </select>

    <div class="stats">
      <div class="stat-box">
        <div class="stat-num" id="ordersCount">-</div>
        <div class="stat-label">طلب جاهز للرفع</div>
      </div>
      <div class="stat-box" style="background:#f0fff4; border-color:#c8e6c9;">
        <div class="stat-num" id="successCount" style="color:#27ae60;">0</div>
        <div class="stat-label">ناجح</div>
      </div>
      <div class="stat-box" style="background:#fff5f5; border-color:#ffcdd2;">
        <div class="stat-num" id="failCount" style="color:#e74c3c;">0</div>
        <div class="stat-label">فاشل</div>
      </div>
    </div>
  </div>

  <!-- تحديد الطلبات -->
  <div class="card">
    <div class="card-title">📋 حدد الطلبات المراد رفعها</div>
    <div class="select-bar">
      <span id="selectedInfo">المحدد: 0 من 0</span>
      <span style="display:flex; gap:6px;">
        <button type="button" class="mini-btn" id="selectAllBtn">تحديد الكل</button>
        <button type="button" class="mini-btn" id="selectNoneBtn">إلغاء التحديد</button>
      </span>
    </div>
    <div id="ordersList" class="orders-list">
      <div class="empty-msg">جاري التحميل...</div>
    </div>
  </div>

  <!-- Progress -->
  <div class="progress-wrap" id="progressWrap">
    <div class="progress-bar" id="progressBar" style="width:0%"></div>
  </div>

  <button id="startUpload" class="btn btn-primary">🚀 إرسال الشحنة</button>
  <button id="viewLogs" class="btn btn-outline" style="margin-top:8px;">📋 عرض سجلات الشحن</button>

  <!-- سجل النشاط -->
  <h3 style="margin: 16px 0 8px; font-size:15px; color:#043B64;">📄 سجل النشاط</h3>
  <div id="logs" class="log-box">
    <div class="log-item info">في انتظار بدء العملية...</div>
  </div>

</div>

<script src="./waseetCities.js"></script>
<script src="./waseetRegions.js"></script>

<script type="module">
import { initializeApp }  from "https://www.gstatic.com/firebasejs/10.13.0/firebase-app.js";
import { getDatabase, ref, get, set } from "https://www.gstatic.com/firebasejs/10.13.0/firebase-database.js";

// ============================================================
// Firebase
// ============================================================
const firebaseConfig = {
  apiKey: "AIzaSyDtEJYJrmyP45qS2da8Cuc6y6Jv5VD0Uhc",
  authDomain: "almurad-system.firebaseapp.com",
  databaseURL: "https://almurad-system-default-rtdb.firebaseio.com",
  projectId: "almurad-system",
  storageBucket: "almurad-system.appspot.com",
  messagingSenderId: "911755824405",
  appId: "1:911755824405:web:2bfbd18ddcf038ca48ad1c"
};
const app = initializeApp(firebaseConfig);
const db  = getDatabase(app);

// ============================================================
// متغيرات
// ============================================================
let readyOrders = [];
let selectedOrderIds = new Set();
let successCount = 0;
let failCount    = 0;
let orderResults = [];

// ============================================================
// مساعدات
// ============================================================
function addLog(text, cls = "info") {
  const box = document.getElementById("logs");
  // امسح الرسالة الافتراضية
  if (box.querySelector(".log-item.info")?.textContent.includes("انتظار")) box.innerHTML = "";
  box.innerHTML += `<div class="log-item ${cls}">${text}</div>`;
  box.scrollTop = box.scrollHeight;
}

function updateStats() {
  document.getElementById("successCount").textContent = successCount;
  document.getElementById("failCount").textContent    = failCount;
}

function setProgress(done, total) {
  const pct = total > 0 ? Math.round((done / total) * 100) : 0;
  document.getElementById("progressBar").style.width = pct + "%";
}

function setLoading(v) {
  const btn = document.getElementById("startUpload");
  btn.disabled    = v;
  btn.textContent = v ? "⏳ جاري الرفع..." : "🚀 إرسال الشحنة";
  document.getElementById("progressWrap").style.display = v ? "block" : "none";
}

// ============================================================
// تحميل الطلبات من ordersTest/مثبت
// ============================================================
async function loadOrders() {
  addLog("🔄 جاري تحميل الطلبات المثبتة...");
  try {
    const snap = await get(ref(db, "ordersTest/مثبت"));

    if (!snap.exists()) {
      addLog("ℹ️ لا توجد طلبات في مسار ordersTest/مثبت", "warn");
      document.getElementById("ordersCount").textContent = "0";
      return;
    }

    const data = snap.val();

    // فلترة: نأخذ فقط الطلبات الحقيقية (ليس _meta)
    readyOrders = Object.entries(data)
      .filter(([id]) => id !== "_meta")
      .map(([id, o]) => ({ id, ...o }))
      // تأكيد الحالة "مثبت" فقط
      .filter(o => !o.status || o.status.trim() === "مثبت");

    document.getElementById("ordersCount").textContent = readyOrders.length;

    if (readyOrders.length > 0) {
      addLog(`✅ تم تحميل ${readyOrders.length} طلب جاهز للرفع`, "ok");
    } else {
      addLog("ℹ️ لا توجد طلبات بحالة 'مثبت' جاهزة للرفع", "warn");
    }

    // تحديد الكل افتراضياً في كل مرة تتحدث فيها القائمة
    selectedOrderIds = new Set(readyOrders.map(o => o.id));
    renderOrderList();

  } catch (err) {
    addLog(`❌ خطأ في تحميل الطلبات: ${err.message}`, "err");
  }
}

// ============================================================
// عرض قائمة الطلبات القابلة للتحديد
// ============================================================
function renderOrderList() {
  const box = document.getElementById("ordersList");

  if (readyOrders.length === 0) {
    box.innerHTML = `<div class="empty-msg">لا توجد طلبات جاهزة حالياً</div>`;
    updateSelectedInfo();
    return;
  }

  box.innerHTML = readyOrders.map(o => `
    <label class="order-row ${selectedOrderIds.has(o.id) ? "checked" : ""}" data-row="${o.id}">
      <input type="checkbox" data-id="${o.id}" ${selectedOrderIds.has(o.id) ? "checked" : ""}>
      <span class="row-id">#${o.id}</span>
      <span class="row-info">${o.productName || "بدون اسم"}${o.advertiser ? " — 🏢 " + o.advertiser : ""}</span>
      <span class="row-price">${Number(o.totalPrice || o.price || 0).toLocaleString("en-US")} د.ع</span>
    </label>
  `).join("");

  box.querySelectorAll('input[type="checkbox"]').forEach(cb => {
    cb.addEventListener("change", () => {
      const id = cb.dataset.id;
      if (cb.checked) selectedOrderIds.add(id); else selectedOrderIds.delete(id);
      cb.closest(".order-row").classList.toggle("checked", cb.checked);
      updateSelectedInfo();
    });
  });

  updateSelectedInfo();
}

function updateSelectedInfo() {
  document.getElementById("selectedInfo").textContent =
    `المحدد: ${selectedOrderIds.size} من ${readyOrders.length}`;
}

document.getElementById("selectAllBtn").onclick = () => {
  selectedOrderIds = new Set(readyOrders.map(o => o.id));
  renderOrderList();
};
document.getElementById("selectNoneBtn").onclick = () => {
  selectedOrderIds = new Set();
  renderOrderList();
};

loadOrders();

// ============================================================
// زر الرفع
// ============================================================
document.getElementById("startUpload").onclick = async () => {
  if (readyOrders.length === 0) {
    addLog("⚠️ لا توجد طلبات مثبتة للرفع", "warn");
    return;
  }

  // فقط الطلبات المحددة فعلياً بالقائمة (يسمح بتقسيم الرفع بين أكثر من شركة)
  const toUpload = readyOrders.filter(o => selectedOrderIds.has(o.id));
  if (toUpload.length === 0) {
    addLog("⚠️ اختر طلب واحد على الأقل قبل الرفع", "warn");
    return;
  }

successCount = 0;
  failCount    = 0;
  orderResults = [];
  updateStats();
  setLoading(true);

  const selectedCompany = document.getElementById("shippingCompany").value;
  const companyLabel = selectedCompany === "prime" ? "برايم" : selectedCompany === "jenni" ? "Jenni" : "الوسيط";
  addLog(`━━━━━━━━━━━━━━━━━━━━━━━━━━━━`);
  addLog(`🚚 شركة الشحن: ${companyLabel}`);
  addLog(`📦 عدد الطلبات المحددة: ${toUpload.length} من أصل ${readyOrders.length}`);

  try {
    // ملاحظة: نستخدم هنا نطاقاً محلياً (shadowing) يقصر متغير readyOrders
    // على الطلبات المحددة فقط داخل هذا الـ try، بدون أي تعديل على الفروع
    // الثلاثة أدناه (الوسيط/برايم/Jenni) التي تستخدم الاسم نفسه.
    const readyOrders = toUpload;

    // ==========================
    // 🟢 الوسيط
    // ==========================
if (selectedCompany === "waseet") {
      addLog("🔄 بدء رفع الطلبات إلى الوسيط...");

      for (let i = 0; i < readyOrders.length; i++) {
        const order = readyOrders[i];
        addLog(`⏳ رفع الطلب #${order.id} (${i + 1}/${readyOrders.length})...`);

        try {
          const response = await fetch("https://almurad.onrender.com/api/create-order", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({
              orderId:         order.id,
              shippingCompany: "waseet",
              waseetCities:    window.waseetCities,
              waseetRegions:   window.waseetRegions
            })
          });

          const contentType = response.headers.get("content-type") || "";
          if (!contentType.includes("application/json")) {
            const text = await response.text();
            failCount++;
            addLog(`✖ الطلب #${order.id} — استجابة غير صالحة: ${text.slice(0, 100)}`, "err");
            setProgress(successCount + failCount, readyOrders.length);
            updateStats();
            continue;
          }

          const data = await response.json();
          const r = data.results?.[0];

          if (r?.success) {
            successCount++;
         addLog(`✔ الطلب #${order.id} — وصل: ${r.receiptNum}`, "ok");
            orderResults.push({ orderId: order.id, receiptNum: r.receiptNum, status: "success" });
          } else {
            failCount++;
            const reason = r?.reason || r?.response?.message || JSON.stringify(r || data);
   addLog(`✖ الطلب #${order.id} — فشل: ${reason}`, "err");
            orderResults.push({ orderId: order.id, receiptNum: "", status: "fail", reason });
          }

        } catch (err) {
          failCount++;
          addLog(`✖ الطلب #${order.id} — خطأ شبكة: ${err.message}`, "err");
        }

        setProgress(successCount + failCount, readyOrders.length);
        updateStats();
        if (i < readyOrders.length - 1) await new Promise(r => setTimeout(r, 300));
      }
    }

    // ==========================
    // 🟣 برايم
    // ==========================
    else if (selectedCompany === "prime") {

      addLog("🔄 بدء رفع الطلبات إلى برايم...");

      for (let i = 0; i < readyOrders.length; i++) {
        const order = readyOrders[i];
        addLog(`⏳ رفع الطلب #${order.id} (${i + 1}/${readyOrders.length})...`);

        try {
  const response = await fetch("https://almurad.onrender.com/api/create-order", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({
              orderId:         order.id,
              shippingCompany: "prime"
            })
          });

          // ✅ تحقق من أن الاستجابة JSON وليست خطأ HTML
          const contentType = response.headers.get("content-type") || "";
          if (!contentType.includes("application/json")) {
            const text = await response.text();
            failCount++;
            addLog(`✖ الطلب #${order.id} — استجابة غير صالحة من السيرفر: ${text.slice(0, 100)}`, "err");
            setProgress(successCount + failCount, readyOrders.length);
            updateStats();
            continue;
          }

          const data = await response.json();

          if (data.success) {
            successCount++;
            addLog(`✔ الطلب #${order.id} — وصل برايم: ${data.shipmentNo}`, "ok");
            orderResults.push({ orderId: order.id, receiptNum: data.shipmentNo || "", status: "success" });
          } else {
            failCount++;
            // ✅ عرض سبب الفشل بشكل واضح
            const reason = data.msg || data.error || JSON.stringify(data);
            addLog(`✖ الطلب #${order.id} — فشل: ${reason}`, "err");
            orderResults.push({ orderId: order.id, receiptNum: "", status: "fail", reason });
          }

        } catch (err) {
          failCount++;
          addLog(`✖ الطلب #${order.id} — خطأ شبكة: ${err.message}`, "err");
        }

        setProgress(successCount + failCount, readyOrders.length);
        updateStats();

        // تأخير بسيط بين الطلبات لتجنب الحمل الزائد
        if (i < readyOrders.length - 1) await new Promise(r => setTimeout(r, 300));
      }
    }

    // ==========================
    // 📦 Jenni
    // ==========================
    else if (selectedCompany === "jenni") {

      addLog("🔄 بدء رفع الطلبات إلى Jenni...");

      for (let i = 0; i < readyOrders.length; i++) {
        const order = readyOrders[i];
        addLog(`⏳ رفع الطلب #${order.id} (${i + 1}/${readyOrders.length})...`);

        try {
          const response = await fetch("https://almurad.onrender.com/api/create-order", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({
              orderId:         order.id,
              shippingCompany: "jenni"
            })
          });

          const contentType = response.headers.get("content-type") || "";
          if (!contentType.includes("application/json")) {
            const text = await response.text();
            failCount++;
            addLog(`✖ الطلب #${order.id} — استجابة غير صالحة من السيرفر: ${text.slice(0, 100)}`, "err");
            setProgress(successCount + failCount, readyOrders.length);
            updateStats();
            continue;
          }

          const data = await response.json();

          if (data.success) {
            successCount++;
            addLog(`✔ الطلب #${order.id} — وصل Jenni: ${data.shipmentNo}`, "ok");
            orderResults.push({ orderId: order.id, receiptNum: data.shipmentNo || "", status: "success" });
          } else {
            failCount++;
            const reason = data.msg || data.error || JSON.stringify(data);
            addLog(`✖ الطلب #${order.id} — فشل: ${reason}`, "err");
            orderResults.push({ orderId: order.id, receiptNum: "", status: "fail", reason });
          }

        } catch (err) {
          failCount++;
          addLog(`✖ الطلب #${order.id} — خطأ شبكة: ${err.message}`, "err");
        }

        setProgress(successCount + failCount, readyOrders.length);
        updateStats();
        if (i < readyOrders.length - 1) await new Promise(r => setTimeout(r, 300));
      }
    }

  } catch (err) {
    addLog(`❌ خطأ عام: ${err.message}`, "err");
  } finally {
    setLoading(false);
    addLog(`━━━━━━━━━━━━━━━━━━━━━━━━━━━━`);
    addLog(`✅ الناجح: ${successCount} | ❌ الفاشل: ${failCount}`,
      failCount === 0 ? "ok" : successCount === 0 ? "err" : "warn");

    // أعد تحميل الطلبات المتبقية
 // حفظ السجل في Firebase
    try {
  const logId = Date.now().toString();
      const ordersObj = {};
      orderResults.forEach((o, i) => { ordersObj[i] = o; });
      await set(ref(db, `shippingLogs/${logId}`), {
        provider: companyLabel,
        createdAt: Date.now(),
        total: successCount + failCount,
        successCount,
        failCount,
        uploadedBy: "admin",
        orders: ordersObj
      });

      // 💰 ملخّص خفيف للسجل — صفحة سجلات الشحن تعرض كروت فيها هذي
      // الحقول بس، وكانت تنزّل شجرة shippingLogs كاملة (٣.٥ ميكابايت،
      // أغلبها تفاصيل طلبات ما تنعرض بالكارت أصلاً) بكل فتحة. هسه
      // تقرا هذا الفرع الخفيف، والتفاصيل تنجاب عند فتح الدفعة بس.
      try {
        await set(ref(db, `shippingLogSummaries/${logId}`), {
          provider: companyLabel,
          createdAt: Date.now(),
          total: successCount + failCount,
          successCount,
          failCount,
          uploadedBy: "admin"
        });
      } catch (e) { console.warn("تعذر حفظ ملخّص السجل:", e.message); }

      addLog("📝 تم حفظ السجل بنجاح", "ok");

      // 🔥 تجهيز مسبق لملف الطباعة: نطلب من السيرفر يبني ملف وصولات
      // هذي الدفعة *هسه* بالخلفية، بدل ما ننتظر لحد ما الموظف يضغط
      // طباعة. ما ننتظر الرد إطلاقاً (fire-and-forget) — السيرفر يرد
      // فوراً ويكمل البناء لحاله، فلما يفتح صفحة السجلات ويضغط طباعة
      // يلقى الملف جاهز وينزل بثانية بدل 15. إذا فشل التجهيز لأي سبب
      // ما يصير شي — الطباعة ترجع تبني الملف وقتها متل قبل بالضبط.
      if (successCount > 0) {
        fetch(`https://almurad.onrender.com/api/prewarm-labels-pdf?logId=${encodeURIComponent(logId)}`)
          .catch(() => {});
        addLog("🖨️ جاري تجهيز ملف الوصولات بالخلفية...", "ok");
      }
    } catch (e) {
      addLog(`⚠️ فشل حفظ السجل: ${e.message}`, "err");
    }

    if (successCount > 0) {
      addLog("🔄 جاري تحديث قائمة الطلبات...");
      await loadOrders();
    }
  }
};
