<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<title>طباعة الوصولات</title>
<!--
  📄 صفحة مخصصة لتوليد PDF حقيقي بجودة الطباعة (نص عربي حاد وواضح 100%،
  مو صورة/تصوير) عبر السيرفر (Puppeteer). ماكو أي واجهة استخدام هنا —
  السيرفر بس هو اللي يفتحها بمتصفح خفي (Chromium) برابط فيه معرّف الدفعة
  أو الطلب، وبعدها ياخذ PDF من نفس الصفحة مباشرة. تصميم الليبل نفسه مسحوب
  بالكامل من labelTemplate.js (نفس الملف المستخدم بصفحة سجلات الشحن)
  حتى يضل التصميم مطابق 100% بين الطباعة المباشرة وملف الـPDF دائماً.
-->
<script>
  // 🛟 شبكة أمان: أي خطأ جافاسكربت أو فشل تحميل سكربت (مثلاً labelTemplate.js
  // أو مكتبة خارجية) كان يخلي الصفحة "تعلق" بصمت، والسيرفر ينتظر 60 ثانية
  // ويطلع "Waiting failed". هسه أي خطأ من هذا النوع ينبلغ للسيرفر فوراً
  // مع سببه الحقيقي. (فشل تحميل صورة شعار ما نعتبره خطأ — له بديل تلقائي)
  window.addEventListener("error", function (e) {
    var isScriptError = (e instanceof ErrorEvent) || (e.target && e.target.tagName === "SCRIPT");
    if (!isScriptError || window.__labelsReady) return;
    window.__labelsError = "خطأ بصفحة الطباعة: " + (e.message || (e.target && e.target.src) || "غير معروف");
    window.__labelsReady = true;
  }, true);
</script>
<style>
  @font-face {
    font-family: 'Tajawal';
    src: url('Tajawal-Regular.ttf');
  }
  html, body { margin: 0; padding: 0; background: #fff; }
</style>
<script src="qrcode-lib.js"></script>
<script src="labelTemplate.js"></script>
<style id="labelStyle"></style>
</head>
<body>
<script type="module">
  const firebaseConfig = {
    apiKey: "AIzaSyDtEJYJrmyP45qS2da8Cuc6y6Jv5VD0Uhc",
    authDomain: "almurad-system.firebaseapp.com",
    databaseURL: "https://almurad-system-default-rtdb.firebaseio.com/",
    projectId: "almurad-system",
    storageBucket: "almurad-system.appspot.com",
    messagingSenderId: "911755824405",
    appId: "1:911755824405:web:2bfbd18ddcf038ca48ad1c"
  };

  // ⚠️ إصلاح (2026-09-22): كانت مكتبة فايربيس تُستورد من gstatic.com
  // بأعلى السكربت دائماً، حتى بالوضع الطبيعي (dataToken) اللي ما يحتاجها
  // أصلاً. إذا تأخر أو فشل هذا التحميل الخارجي بسيرفر Render، السكربت
  // كله ما يشتغل، فالصفحة ما تكَول "جاهزة" أبداً ويطلع خطأ
  // "Waiting failed: 60000ms exceeded". هسه فايربيس تنحمّل بس إذا فعلاً
  // احتجناها (فتح الصفحة يدوياً بدون dataToken).
  let db, ref, get;
  async function initFirebase() {
    if (db) return;
    const { initializeApp } = await import("https://www.gstatic.com/firebasejs/10.13.0/firebase-app.js");
    const dbMod = await import("https://www.gstatic.com/firebasejs/10.13.0/firebase-database.js");
    ref = dbMod.ref;
    get = dbMod.get;
    db = dbMod.getDatabase(initializeApp(firebaseConfig));
  }

  function fail(msg) {
    console.error(msg);
    window.__labelsError = msg;
    window.__labelsReady = true;
    document.body.innerHTML = `<div style="padding:20px;font-family:sans-serif;color:#c00">${msg}</div>`;
  }

  // ملاحظة (2026-09-23): كانت هنا fetchAllOrdersTree تسحب فرع ordersTest
  // كامل. صارت القراءة بمسار كل طلب مباشرة (fetchOrderById بملف
  // labelTemplate.js). هذا المسار احتياطي أصلاً — الوضع الطبيعي إن
  // السيرفر يمرر البيانات جاهزة عبر dataToken.

  async function run() {
    if (typeof LABEL_STYLE_CSS === "undefined" || typeof buildLabelHTML !== "function") {
      return fail("تعذر تحميل labelTemplate.js");
    }
    document.getElementById("labelStyle").textContent = LABEL_STYLE_CSS;

    const params = new URLSearchParams(location.search);
    const logId = params.get("logId");
    const orderId = params.get("orderId");
    const receiptNumParam = params.get("receiptNum");

    let orders = [];
    const dataToken = params.get("dataToken");

    // ✅ الوضع الطبيعي دائماً: السيرفر (backend/server.js) يجيب بيانات
    // الطلبات هو نفسه من فايربيس، ويخزنها مؤقتاً برمز قصير العمر يوصلنا
    // بالرابط (dataToken) — نجيبها بطلب بسيط لنفس السيرفر. نرجع لطريقة
    // الاتصال المباشر بالأسفل فقط احتياطاً، لو حدا فتح هذي الصفحة يدوياً.
    if (dataToken) {
      const resp = await fetch(`/api/print-labels-data/${dataToken}`);
      if (!resp.ok) return fail("تعذر جلب بيانات الطباعة (انتهت صلاحيتها أو استُخدمت من قبل)");
      orders = await resp.json();
      if (!Array.isArray(orders) || !orders.length) return fail("لا توجد طلبات لطباعتها");
    } else if (logId) {
      await initFirebase();
      const snap = await get(ref(db, `shippingLogs/${logId}/orders`));
      if (!snap.exists()) return fail("لا توجد طلبات بهذا السجل");
      const stubs = Object.values(snap.val()).filter(s => s?.status === "success");
      if (!stubs.length) return fail("لا توجد طلبات ناجحة بهذا السجل");

      const byId = new Map(stubs.filter(x => x && x.orderId).map(x => [String(x.orderId), x]));
      const found = await fetchOrdersByIds({ db, ref, get }, [...byId.keys()]);
      for (const full of found) {
        const stub = byId.get(String(full.id));
        orders.push({ ...full, receiptNum: (stub && stub.receiptNum) || full.receiptNum });
      }
      if (!orders.length) return fail("تعذر إيجاد أي طلب من هذا السجل بقاعدة البيانات الحالية");
    } else if (orderId) {
      await initFirebase();
      const full = await fetchOrderById({ db, ref, get }, orderId);
      if (!full) return fail("الطلب غير موجود في قاعدة البيانات");
      if (receiptNumParam) full.receiptNum = receiptNumParam;
      orders = [full];
    } else {
      return fail("لازم تمرر logId أو orderId بالرابط");
    }

    // ✅ رقم الصفحة يجي جاهز من السيرفر (__pageNum) لما تنقسم الدفعة
    // لمجموعات، حتى يبقى الترقيم متسلسل عبر الدفعة كاملة (1/80، 2/80...)
    // بدل ما يبلش من جديد بكل مجموعة (1/20، 1/20...)
    const html = orders.map((o, i) => buildLabelHTML(o, o.__pageNum || `${i + 1} / ${orders.length}`)).join("");
    document.body.insertAdjacentHTML("beforeend", html);
    attachLogoFallback(document.body);

    await waitForLabelImages(document.body, 3000);
    // ✅ نفس تصغير-إذا-فاض المستخدم بالطباعة المباشرة بالضبط
    fitLabelPagesToBox(document.querySelectorAll(".label-page"));
    window.__labelsReady = true;
  }

  run().catch(err => fail("خطأ غير متوقع: " + err.message));
</script>
</body>
</html>
